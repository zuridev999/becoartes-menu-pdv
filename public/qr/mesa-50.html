<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Code - Mesa 50</title>
    <style>
      :root {
        color: #0a0a0c;
        font-family: Arial, sans-serif;
      }

      body {
        align-items: center;
        background: #f7f5ef;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #fff;
        border: 1px solid #ddd6c7;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        max-width: 360px;
        padding: 28px;
        text-align: center;
      }

      img {
        display: block;
        margin: 20px auto;
        max-width: 260px;
        width: 100%;
      }

      h1 {
        font-size: 34px;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 0;
      }

      p {
        color: #6f6877;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 8px 0 0;
        text-transform: uppercase;
      }

      a {
        color: #7229b6;
        display: block;
        font-size: 12px;
        margin-top: 16px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mesa 50</h1>
      <p>Escaneie para pedir</p>
      <img src="/qr/mesa-50.svg" alt="QR Code permanente da Mesa 50" />
      <a href="https://qr.becoartes.com/mesa/50">https://qr.becoartes.com/mesa/50</a>
    </main>
  </body>
</html>
