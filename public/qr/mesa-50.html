<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Becoartes - QR Mesa 50</title>
    <style>
      body {
        align-items: center;
        background: #0a0a0c;
        color: #fff;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #fff;
        border-radius: 28px;
        color: #111;
        padding: 32px;
        text-align: center;
        width: min(420px, calc(100vw - 32px));
      }

      img {
        display: block;
        margin: 18px auto;
        width: min(300px, 80vw);
      }

      a {
        color: #6f2dbd;
        font-weight: 800;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <p>BECOARTES</p>
      <h1>Mesa 50</h1>
      <img src="./mesa-50.svg" alt="QR Code permanente da Mesa 50" />
      <a href="https://qr.becoartes.com/mesa/50">https://qr.becoartes.com/mesa/50</a>
    </main>
  </body>
</html>
