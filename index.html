<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Becoartes Tablet</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
      // Bloquear menu de contexto (clique direito / toque longo)
      document.addEventListener('contextmenu', e => e.preventDefault());

      // Bloquear o "arrastar para baixo" (Pull-to-refresh)
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault(); // Multi-touch block
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        // Permitir scroll apenas se estiver dentro de um elemento com scroll
        const path = e.composedPath();
        const hasScrollable = path.some(el => el.classList && el.classList.contains('custom-scrollbar'));
        if (!hasScrollable) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
