<!doctype html>
<html lang="pt-BR" style="overscroll-behavior: none !important;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-adsense-account" content="ca-pub-8099608758666537" />
    <script
      id="becoartes-adsense-script"
      nonce="__CSP_NONCE__"
      async
      crossorigin="anonymous"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8099608758666537"
    ></script>
    <title>Becoartes PDV</title>
    <script nonce="__CSP_NONCE__">
      // Restaura o tema salvo antes do React montar (evita flash).
      try {
        if (localStorage.getItem('pdv-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) { /* noop */ }

      const becoHost = window.location.hostname;
      if (becoHost.startsWith('qr.')) {
        document.title = 'Becoartes Pedidos';
      } else if (becoHost.startsWith('tablet.')) {
        document.title = 'Becoartes Tablet';
      } else if (becoHost.startsWith('coz.')) {
        document.title = 'Becoartes Cozinha';
      } else if (becoHost.startsWith('bar.')) {
        document.title = 'Becoartes Bar';
      } else if (becoHost.startsWith('pdv.')) {
        document.title = 'Becoartes PDV';
      }

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            registration.update();
            window.setInterval(() => registration.update(), 60 * 1000);
          });
        });
      }
      // Unregister old ones if any (cleanup)
      // navigator.serviceWorker.getRegistrations().then(...) // Keep it simple for now
      // Bloquear menu de contexto (clique direito / toque longo)
      document.addEventListener('contextmenu', e => e.preventDefault());

    </script>
  </head>
  <body>
    <div id="root"></div>
    <script nonce="__CSP_NONCE__" type="module" src="/src/main.tsx"></script>
  </body>
</html>
