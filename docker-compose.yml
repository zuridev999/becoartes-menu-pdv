version: '3.8'

services:
  becoartes-operational:
    build:
      context: .
      args:
        VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
        VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
        VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
        VITE_OS_ALLOWED_ORIGINS: ${VITE_OS_ALLOWED_ORIGINS:-https://os.becoartes.com}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.2.12}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      VITE_TURSO_DATABASE_URL: ${VITE_TURSO_DATABASE_URL}
      VITE_TURSO_AUTH_TOKEN: ${VITE_TURSO_AUTH_TOKEN}
      BOOTSTRAP_ADMIN_PIN: ${BOOTSTRAP_ADMIN_PIN:-}
      DEFAULT_MANAGER_PIN: ${DEFAULT_MANAGER_PIN:-2020}
      DEFAULT_OPERATOR_PIN: ${DEFAULT_OPERATOR_PIN:-0040}
      TABLET_SETUP_PIN: ${TABLET_SETUP_PIN:-0040}
      ADMIN_BYPASS_PIN: ${ADMIN_BYPASS_PIN:-0806}
      ALLOWED_OPERATION_IPS: ${ALLOWED_OPERATION_IPS:-}
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET:-}
      OS_EMPRESA_ID: ${OS_EMPRESA_ID:-}
      OS_TENANT_SLUG: ${OS_TENANT_SLUG:-becoartes}
      OS_SYSTEM_USER_ID: ${OS_SYSTEM_USER_ID:-}
      VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
      VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
      VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.2.12}
      VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
      DELIVERY_PAYMENT_PROVIDER: ${DELIVERY_PAYMENT_PROVIDER:-mock}
      DELIVERY_LOGISTICS_PROVIDER: ${DELIVERY_LOGISTICS_PROVIDER:-disabled}
      DELIVERY_KITCHEN_DISPATCH_MODE: ${DELIVERY_KITCHEN_DISPATCH_MODE:-mock}
      DELIVERY_PUBLIC_STATUS: ${DELIVERY_PUBLIC_STATUS:-building}
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-}
      DELIVERY_EMAIL_PROVIDER: ${DELIVERY_EMAIL_PROVIDER:-mock}
      DELIVERY_SMS_PROVIDER: ${DELIVERY_SMS_PROVIDER:-mock}
      DELIVERY_WHATSAPP_PROVIDER: ${DELIVERY_WHATSAPP_PROVIDER:-mock}
      PAGBANK_API_BASE_URL: ${PAGBANK_API_BASE_URL:-https://api.pagseguro.com}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN:-}
      PAGBANK_NOTIFICATION_URL: ${PAGBANK_NOTIFICATION_URL:-}
      PAGBANK_REDIRECT_URL: ${PAGBANK_REDIRECT_URL:-}
      IFOOD_API_BASE_URL: ${IFOOD_API_BASE_URL:-https://merchant-api.ifood.com.br}
      IFOOD_ACCESS_TOKEN: ${IFOOD_ACCESS_TOKEN:-}
      IFOOD_MERCHANT_ID: ${IFOOD_MERCHANT_ID:-}
      IFOOD_SHIPPING_MODE: ${IFOOD_SHIPPING_MODE:-dry_run}
      IFOOD_PREPARATION_TIME_SECONDS: ${IFOOD_PREPARATION_TIME_SECONDS:-900}
      DELIVERY_GEOCODER_PROVIDER: ${DELIVERY_GEOCODER_PROVIDER:-mock}
      DELIVERY_POSTAL_CODE_PROVIDER: ${DELIVERY_POSTAL_CODE_PROVIDER:-mock}
      DELIVERY_MOCK_LATITUDE: ${DELIVERY_MOCK_LATITUDE:--23.5505}
      DELIVERY_MOCK_LONGITUDE: ${DELIVERY_MOCK_LONGITUDE:--46.6333}
      DELIVERY_COUPONS_JSON: ${DELIVERY_COUPONS_JSON:-}
      DELIVERY_CLUB_CYCLE_SIZE: ${DELIVERY_CLUB_CYCLE_SIZE:-10}
      DELIVERY_CLUB_REWARD_LABEL: ${DELIVERY_CLUB_REWARD_LABEL:-1 prato gratuito}
      PORT: 80
    container_name: becoartes-operational
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - becoartes-os_default

networks:
  becoartes-os_default:
    external: true
