version: '3.8'

services:
  becoartes-operational:
    build:
      context: .
      args:
        VITE_TURSO_DATABASE_URL: ${VITE_TURSO_DATABASE_URL}
        VITE_TURSO_AUTH_TOKEN: ${VITE_TURSO_AUTH_TOKEN}
        VITE_TABLET_SETUP_PIN: ${VITE_TABLET_SETUP_PIN:-0040}
        VITE_BOOTSTRAP_ADMIN_PIN: ${VITE_BOOTSTRAP_ADMIN_PIN:-}
        VITE_DEFAULT_MANAGER_PIN: ${VITE_DEFAULT_MANAGER_PIN:-2020}
        VITE_DEFAULT_OPERATOR_PIN: ${VITE_DEFAULT_OPERATOR_PIN:-0040}
        VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
        VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
        VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
        VITE_OS_ALLOWED_ORIGINS: ${VITE_OS_ALLOWED_ORIGINS:-https://os.becoartes.com}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.2.13}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
    container_name: becoartes-operational
    restart: always
    environment:
      VITE_TURSO_DATABASE_URL: ${VITE_TURSO_DATABASE_URL}
      VITE_TURSO_AUTH_TOKEN: ${VITE_TURSO_AUTH_TOKEN}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      VITE_TABLET_SETUP_PIN: ${VITE_TABLET_SETUP_PIN:-0040}
      TABLET_SETUP_PIN: ${TABLET_SETUP_PIN:-}
      VITE_BOOTSTRAP_ADMIN_PIN: ${VITE_BOOTSTRAP_ADMIN_PIN:-}
      BOOTSTRAP_ADMIN_PIN: ${BOOTSTRAP_ADMIN_PIN:-}
      VITE_DEFAULT_MANAGER_PIN: ${VITE_DEFAULT_MANAGER_PIN:-2020}
      DEFAULT_MANAGER_PIN: ${DEFAULT_MANAGER_PIN:-}
      VITE_DEFAULT_OPERATOR_PIN: ${VITE_DEFAULT_OPERATOR_PIN:-0040}
      DEFAULT_OPERATOR_PIN: ${DEFAULT_OPERATOR_PIN:-}
      ADMIN_BYPASS_PIN: ${ADMIN_BYPASS_PIN:-0806}
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET:-}
      VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
      OS_EMPRESA_ID: ${OS_EMPRESA_ID:-}
      VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
      OS_TENANT_SLUG: ${OS_TENANT_SLUG:-}
      VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
      OS_SYSTEM_USER_ID: ${OS_SYSTEM_USER_ID:-}
      VITE_OS_ALLOWED_ORIGINS: ${VITE_OS_ALLOWED_ORIGINS:-https://os.becoartes.com}
      ALLOWED_WEB_ORIGINS: ${ALLOWED_WEB_ORIGINS:-}
      ALLOWED_OPERATION_IPS: ${ALLOWED_OPERATION_IPS:-}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.2.13}
      VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
      PORT: 80
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - becoartes-os_default

networks:
  becoartes-os_default:
    external: true
