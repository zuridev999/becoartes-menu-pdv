version: '3.8'

services:
  becoartes-operational:
    build:
      context: .
      args:
        VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
        VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
        VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
        VITE_OS_ALLOWED_ORIGINS: ${VITE_OS_ALLOWED_ORIGINS:-https://os.becoartes.com}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.9.0}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
        VITE_APP_BUILD_DATE: ${VITE_APP_BUILD_DATE:-}
        VITE_BUSINESS_TIME_ZONE: ${VITE_BUSINESS_TIME_ZONE:-America/Sao_Paulo}
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-${VITE_TURSO_DATABASE_URL:-}}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-${VITE_TURSO_AUTH_TOKEN:-}}
      BOOTSTRAP_ADMIN_PIN: ${BOOTSTRAP_ADMIN_PIN:-${VITE_BOOTSTRAP_ADMIN_PIN:-}}
      DEFAULT_MANAGER_PIN: ${DEFAULT_MANAGER_PIN:-${VITE_DEFAULT_MANAGER_PIN:?DEFAULT_MANAGER_PIN is required}}
      DEFAULT_OPERATOR_PIN: ${DEFAULT_OPERATOR_PIN:-${VITE_DEFAULT_OPERATOR_PIN:?DEFAULT_OPERATOR_PIN is required}}
      TABLET_SETUP_PIN: ${TABLET_SETUP_PIN:-${VITE_TABLET_SETUP_PIN:?TABLET_SETUP_PIN is required}}
      ADMIN_BYPASS_PIN: ${ADMIN_BYPASS_PIN:-}
      ADMIN_BYPASS_ENABLED: ${ADMIN_BYPASS_ENABLED:-false}
      ALLOWED_OPERATION_IPS: ${ALLOWED_OPERATION_IPS:-}
      OPERATION_ACCESS_TEMPORARY_UNTIL: ${OPERATION_ACCESS_TEMPORARY_UNTIL:-}
      NODE_ENV: ${NODE_ENV:-production}
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET:?BFF_SESSION_SECRET is required}
      DELIVERY_CUSTOMER_CODE_SECRET: ${DELIVERY_CUSTOMER_CODE_SECRET:?DELIVERY_CUSTOMER_CODE_SECRET is required}
      DELIVERY_CUSTOMER_SESSION_TTL_DAYS: ${DELIVERY_CUSTOMER_SESSION_TTL_DAYS:-14}
      OS_CHECKLIST_ALERTS_URL: ${OS_CHECKLIST_ALERTS_URL:-https://os.becoartes.com/api/operational/checklist-alerts?slug=becoartes}
      OS_OPERATIONAL_ALERTS_TOKEN: ${OS_OPERATIONAL_ALERTS_TOKEN:-}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-2097152}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/Sao_Paulo}
      OS_EMPRESA_ID: ${OS_EMPRESA_ID:-${VITE_OS_EMPRESA_ID:-}}
      OS_TENANT_SLUG: ${OS_TENANT_SLUG:-becoartes}
      OS_SYSTEM_USER_ID: ${OS_SYSTEM_USER_ID:-${VITE_OS_SYSTEM_USER_ID:-}}
      VITE_TURSO_DATABASE_URL: ${VITE_TURSO_DATABASE_URL:-}
      VITE_TURSO_AUTH_TOKEN: ${VITE_TURSO_AUTH_TOKEN:-}
      VITE_OS_EMPRESA_ID: ${VITE_OS_EMPRESA_ID:-}
      VITE_OS_TENANT_SLUG: ${VITE_OS_TENANT_SLUG:-becoartes}
      VITE_OS_SYSTEM_USER_ID: ${VITE_OS_SYSTEM_USER_ID:-}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-v1.9.0}
      VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
      APP_BUILD_DATE: ${APP_BUILD_DATE:-${VITE_APP_BUILD_DATE:-}}
      VITE_APP_BUILD_DATE: ${VITE_APP_BUILD_DATE:-}
      DELIVERY_PAYMENT_PROVIDER: ${DELIVERY_PAYMENT_PROVIDER:-mock}
      DELIVERY_LOGISTICS_PROVIDER: ${DELIVERY_LOGISTICS_PROVIDER:-disabled}
      DELIVERY_KITCHEN_DISPATCH_MODE: ${DELIVERY_KITCHEN_DISPATCH_MODE:-mock}
      DELIVERY_PUBLIC_STATUS: ${DELIVERY_PUBLIC_STATUS:-building}
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-}
      DELIVERY_EMAIL_PROVIDER: ${DELIVERY_EMAIL_PROVIDER:-mock}
      DELIVERY_SMS_PROVIDER: ${DELIVERY_SMS_PROVIDER:-mock}
      DELIVERY_WHATSAPP_PROVIDER: ${DELIVERY_WHATSAPP_PROVIDER:-mock}
      DELIVERY_EMAIL_WEBHOOK_URL: ${DELIVERY_EMAIL_WEBHOOK_URL:-}
      DELIVERY_SMS_WEBHOOK_URL: ${DELIVERY_SMS_WEBHOOK_URL:-}
      DELIVERY_WHATSAPP_WEBHOOK_URL: ${DELIVERY_WHATSAPP_WEBHOOK_URL:-}
      DELIVERY_NOTIFICATION_WEBHOOK_SECRET: ${DELIVERY_NOTIFICATION_WEBHOOK_SECRET:-}
      PAGBANK_API_BASE_URL: ${PAGBANK_API_BASE_URL:-https://api.pagseguro.com}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN:-}
      PAGBANK_NOTIFICATION_URL: ${PAGBANK_NOTIFICATION_URL:-}
      PAGBANK_REDIRECT_URL: ${PAGBANK_REDIRECT_URL:-}
      IFOOD_API_BASE_URL: ${IFOOD_API_BASE_URL:-https://merchant-api.ifood.com.br}
      IFOOD_ACCESS_TOKEN: ${IFOOD_ACCESS_TOKEN:-}
      IFOOD_MERCHANT_ID: ${IFOOD_MERCHANT_ID:-}
      IFOOD_SHIPPING_MODE: ${IFOOD_SHIPPING_MODE:-dry_run}
      IFOOD_PREPARATION_TIME_SECONDS: ${IFOOD_PREPARATION_TIME_SECONDS:-900}
      DELIVERY_GEOCODER_PROVIDER: ${DELIVERY_GEOCODER_PROVIDER:-mock}
      DELIVERY_POSTAL_CODE_PROVIDER: ${DELIVERY_POSTAL_CODE_PROVIDER:-mock}
      DELIVERY_MOCK_LATITUDE: ${DELIVERY_MOCK_LATITUDE:--23.5505}
      DELIVERY_MOCK_LONGITUDE: ${DELIVERY_MOCK_LONGITUDE:--46.6333}
      DELIVERY_COUPONS_JSON: ${DELIVERY_COUPONS_JSON:-}
      DELIVERY_CLUB_CYCLE_SIZE: ${DELIVERY_CLUB_CYCLE_SIZE:-10}
      DELIVERY_CLUB_REWARD_LABEL: ${DELIVERY_CLUB_REWARD_LABEL:-1 prato gratuito}
      PORT: 80
    container_name: becoartes-operational
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:80/api/health')
          .then((response) => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - becoartes-os_default

networks:
  becoartes-os_default:
    external: true
