version: '3.8'

services:
  becoartes-operational:
    build: .
    container_name: becoartes-operational
    restart: always
    ports:
      - "8080:80"
    environment:
      - VITE_TURSO_DATABASE_URL=${VITE_TURSO_DATABASE_URL}
      - VITE_TURSO_AUTH_TOKEN=${VITE_TURSO_AUTH_TOKEN}
    networks:
      - becoartes-os_default

networks:
  becoartes-os_default:
    external: true
