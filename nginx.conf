server {
    listen 80;
    server_name pdv.becoartes.com coz.becoartes.com tablet.becoartes.com qr.becoartes.com delivery.becoartes.com;
    root /usr/share/nginx/html;

    set $beco_content_security_policy "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic' 'unsafe-inline' 'unsafe-eval' https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors https://os.becoartes.com";
    sub_filter '__CSP_NONCE__' $request_id;
    sub_filter_once off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $beco_content_security_policy always;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /ads.txt {
        default_type text/plain;
        try_files /ads.txt =404;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $beco_content_security_policy always;
    }

    # Desativar cache para o index.html (evitar problemas de atualização)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $beco_content_security_policy always;
    }
}
